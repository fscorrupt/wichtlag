---
services:
  wichtlag:
    hostname: "wichtlag"
    container_name: "wichtlag"
    image: "ghcr.io/fscorrupt/wichtlag:latest"
    restart: "${RESTARTAPP:-unless-stopped}"
    environment:
      - "TZ=${TZ:-Europe/Berlin}"
      - "UMASK=${UMASK:-0022}"
      - "PORT=3000"
      - "DATA_DIR=/app/data"
    networks:
      - ${DOCKERNETWORK:-proxy}
    security_opt:
      - "${SECURITYOPS:-no-new-privileges}:${SECURITYOPSSET:-true}"
    volumes:
      - "${APPFOLDER}/wichtlag:/app/data:rw"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "dockupdater.enable=true"
      - "traefik.http.routers.wichtlag-rtr.entrypoints=https"
      - "traefik.http.routers.wichtlag-rtr.rule=Host(`wichtel.${DOMAIN}`)"
      - "traefik.http.routers.wichtlag-rtr.tls=true"
      - "traefik.http.routers.wichtlag-rtr.tls.certresolver=dns-cloudflare"
      # Hinweis: Keine Authelia-Middleware, damit Teilnehmer ohne SSO-Account beitreten können:
      # - "traefik.http.routers.wichtlag-rtr.middlewares=chain-authelia@file"
      - "traefik.http.routers.wichtlag-rtr.service=wichtlag-svc"
      - "traefik.http.services.wichtlag-svc.loadbalancer.server.port=3000"

networks:
  proxy:
    driver: bridge
    external: true
